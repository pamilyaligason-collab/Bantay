# Release the Android app from GitHub: Actions > Release Android app > Run workflow (works from the GitHub phone app).
# Same steps as scripts/release-apk.ps1: tests, production build, signed APK, GitHub release, public/latest.json on main.
# Phones on the APK then see the update in the app (it reads releases/latest/download/latest.json); /get reads /latest.json.
# One-time setup (docs/RELEASE.md): secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD,
# variables VITE_SUPABASE_URL + VITE_SUPABASE_PUBLISHABLE_KEY + ANDROID_CERT_SHA256.
name: Release Android app

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed, in one plain sentence (shown in the app's update sheet)
        required: true
      version:
        description: Version like 2.1.1. Empty = next patch after the latest release
        required: false
        default: ''
      min_shell:
        description: Shells older than this versionCode must update (raise only for a breaking native change)
        required: false
        default: '2000000'

concurrency: release-apk

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prev=$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          prev=${prev#v}
          v=${INPUT_VERSION:-}
          if [ -z "$v" ]; then IFS=. read -r a b c <<<"$prev"; v="$a.$b.$((c + 1))"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$v' is not like 2.1.1"; exit 1; }
          code() { IFS=. read -r a b c <<<"$1"; echo $((a * 1000000 + b * 1000 + c)); }
          [ "$(code "$v")" -gt "$(code "$prev")" ] || { echo "::error::$v is not newer than $prev"; exit 1; }
          if gh release view "v$v" --repo "$REPO" >/dev/null 2>&1; then echo "::error::release v$v already exists"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$(code "$v")" >> "$GITHUB_OUTPUT"
          echo "Releasing $v (after $prev)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install, typecheck, test
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Build web + sync Android
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npx cap sync android

      - name: Signing key (temp file, removed at the end)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set (docs/RELEASE.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=bantay\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Android tests + signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease "-PversionCode=${{ steps.v.outputs.code }}" "-PversionName=${{ steps.v.outputs.version }}"

      - name: Check the APK is signed with the family key
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$signer" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "signed by $got"
          [ -n "$EXPECTED" ] || { echo "::error::variable ANDROID_CERT_SHA256 is not set"; exit 1; }
          [ "$got" = "$EXPECTED" ] || { echo "::error::APK is signed with a different key ($got); phones would refuse the update"; exit 1; }

      - name: Release files + latest.json
        env:
          NOTES: ${{ inputs.notes }}
          MIN_SHELL: ${{ inputs.min_shell }}
        run: |
          set -euo pipefail
          v=${{ steps.v.outputs.version }}
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/app-release.apk "release-out/bantay-$v.apk"
          cp "release-out/bantay-$v.apk" release-out/bantay.apk
          jq -n --argjson code ${{ steps.v.outputs.code }} --arg v "$v" \
            --arg url "https://github.com/$REPO/releases/download/v$v/bantay-$v.apk" \
            --arg sha "$(sha256sum "release-out/bantay-$v.apk" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "release-out/bantay-$v.apk")" \
            --argjson min "$MIN_SHELL" --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $v, url: $url, sha256: $sha, size: $size, minShell: $min, notes: $notes}' > release-out/latest.json
          cat release-out/latest.json

      - name: Publish release, then latest.json on main
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" "release-out/bantay-$v.apk" release-out/bantay.apk release-out/latest.json \
            --repo "$REPO" --target main --title "Bantay $v" --notes "$NOTES"
          cp release-out/latest.json public/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/latest.json
          git commit -m "release: latest.json $v"
          git push origin HEAD:main
          echo "### Released Bantay $v" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$REPO/releases/tag/v$v" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties
