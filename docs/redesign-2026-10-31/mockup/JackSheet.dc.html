<style>

.ph{width:390px;height:844px;box-sizing:border-box;background:#F5F3EF;color:#1C1B19;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}

</style>
</helmet>
<div class="ph" style="height: 844px;">
  <div style="padding: 20px 16px 0; filter: blur(2px); opacity: 0.55;" aria-hidden="true">
    <div style="font-size: 13px; font-weight: 600; color: #6B675F; letter-spacing: 0.04em;">SATURDAY, OCT 31</div>
    <div style="font-size: 32px; font-weight: 700; margin-top: 4px;">Good evening, Rey</div>
    <div style="height: 250px; border-radius: 24px; background: #1B2B4B; margin-top: 18px;"></div>
    <div style="height: 60px; border-radius: 20px; background: #FDF1DC; margin-top: 10px;"></div>
    <div style="height: 300px; border-radius: 20px; background: #fff; margin-top: 40px;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(28,27,25,.38);"></div>

  <div role="dialog" aria-label="Jack" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F3EF; border-radius: 30px 30px 0 0; padding: 8px 16px 28px; box-shadow: 0 -10px 30px rgba(0,0,0,.18);">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #CFC9BE; margin: 0 auto 12px;"></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px 16px;">

      <div style="flex: 1;"><div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">Hi Rey, what do you need?</div><div style="font-size: 15px; color: #6B675F;">Jack is always here, on every tab.</div></div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: #E9E5DE; display: flex; align-items: center; justify-content: center; color: #4A463F;"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m2 2 10 10M12 2 2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></a>
    </div>

    <button class="opt" style="background: #B42318; color: #fff; padding: 18px 16px;">
      <span class="big" style="background: rgba(255,255,255,.16); position: relative;">
        <svg width="52" height="52" viewBox="0 0 52 52" style="position: absolute; inset: 0;" aria-hidden="true"><circle cx="26" cy="26" r="23" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3"></circle><circle cx="26" cy="26" r="23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="48 144.5" transform="rotate(-90 26 26)"></circle></svg>
        <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.02em;">SOS</span>
      </span>
      <span style="flex: 1;"><span class="ot" style="display: block;">Hold for help</span><span class="os" style="display: block; color: #FDE3DF;">Hold 3 seconds. Calls your first family contact and texts your place.</span></span>
    </button>
    <div style="font-size: 13px; color: #6B675F; text-align: center; margin: 8px 0 12px;">Cannot hold? <a href="Safety.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 8px;font-weight: 600;">Open Safety</a> for Call 911 and Medical ID.</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button class="opt" style="background: #fff; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 150px;">
        <span class="big" style="background: #E5EDFB; color: #2459C7;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg></span>
        <span><span class="ot" style="display: block;">Scan</span><span class="os" style="display: block;">Lab paper, prescription or ID</span></span>
      </button>
      <button class="opt" style="background: #fff; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 150px;">
        <span class="big" style="background: #E3EFE8; color: #1E6B4E;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></span>
        <span><span class="ot" style="display: block;">Chat</span><span class="os" style="display: block;">Ask or log anything</span></span>
      </button>
    </div>

    <div style="margin-top: 16px; font-size: 13px; font-weight: 600; color: #6B675F; letter-spacing: 0.04em; padding: 0 4px;">TRY SAYING</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
      <button class="chip">Add a medicine</button>
      <button class="chip">Log my BP</button>
      <button class="chip">What does ALT mean?</button>
    </div>
  </div>
</div>
